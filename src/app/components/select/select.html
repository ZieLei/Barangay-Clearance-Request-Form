<div class="relative inline-block font-space-mono">
  <!-- Trigger -->
  <button
    type="button"
    class="retro-input flex flex-row items-center justify-between gap-2 w-70 text-left"
    [class.opacity-50]="disabled"
    [disabled]="disabled"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <span class="truncate" [class.opacity-45]="!value" [class.uppercase]="!value"
      [class.font-space-grotesk]="!value" [class.text-sm]="!value">
      {{ value ?? placeholder() }}
    </span>
    <i
      class="pixelart-icons-font-chevron-down text-base leading-none transition-transform"
      [class.rotate-180]="isOpen"
      aria-hidden="true"
    ></i>
  </button>

  <!-- Options -->
  @if (isOpen) {
    <ul
      role="listbox"
      class="retro-panel absolute left-0 top-full mt-2 z-50 w-70 p-1 flex flex-col gap-0.5"
    >
      @for (option of options(); track option; let i = $index) {
        <li
          role="option"
          class="retro-item px-2 py-1.5"
          [attr.aria-selected]="option === value"
          [attr.data-active]="i === activeIndex"
          (click)="choose(option)"
          (mouseenter)="activeIndex = i"
        >
          {{ option }}
        </li>
      }
    </ul>
  }
</div>
