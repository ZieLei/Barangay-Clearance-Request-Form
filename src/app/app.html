<div class="min-h-200 m-8 p-5 border-2 border-text-primary shadow-[6px_6px_0px_0px_#252422]">
  <div class="flex flex-row justify-between">
    <div class="flex bg-text-primary p-1 w-fit px-5">
      <h1 class="text-xl text-background font-line-seed font-bold">
        Barangay Clearance Request Form
      </h1>
    </div>

    <button type="button" (click)="isDark = !isDark" class="relative flex h-8 w-16 p-1 border-2 border-text-primary items-center shadow-[6px_6px_0px_0px_#252422]
             active:translate-x-1.5 active:translate-y-1.5 active:shadow-none
             transition-all duration-200" [class.bg-background]="!isDark">

      <span class="h-5 w-5 bg-text-primary transition-transform" [class.translate-x-8]="isDark"
        [class.translate-x-0]="!isDark">
      </span>
    </button>
  </div>

  <form [formGroup]="form" class="flex flex-row justify-evenly">
    <div class="flex-1 m-5 p-3 border-2 border-text-primary shadow-[6px_6px_0px_0px_#252422]">
      <div class="flex flex-col gap-1">
        <label for="fullName" class="font-line-seed font-bold text-sm">FULL NAME</label>
        <input id="fullName" type="text" formControlName="fullName"
          class="border-2 bg-border/50 font-line-seed text-text-primary border-text-primary w-70 py-2 px-1 h-9 shadow-[inset_0px_6px_0px_0px_#252422] focus:outline-none">
      </div>

      <div class="flex flex-col gap-1">
        <div class="flex flex-col gap-1">
          <label class="font-line-seed font-bold text-sm">
            BIRTHDATE
          </label>

          <app-date-picker formControlName="birthdate" />
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label for="address" class="font-line-seed font-bold text-sm">ADDRESS</label>
        <input id="address" type="text" formControlName="address"
          class="border-2 bg-border/50 font-line-seed text-text-primary border-text-primary w-70 py-2 px-1 h-9 shadow-[inset_0px_6px_0px_0px_#252422] focus:outline-none">
      </div>

      <div class="flex flex-col gap-1">
        <label for="contactNumber" class="font-line-seed font-bold text-sm">CONTACT NUMBER</label>
        <input id="contactNumber" type="tel" formControlName="contactNumber"
          class="border-2 bg-border/50 font-line-seed text-text-primary border-text-primary w-70 py-2 px-1 h-9 shadow-[inset_0px_6px_0px_0px_#252422] focus:outline-none">
      </div>

      <div class="flex flex-col gap-1">
        <label class="font-line-seed font-bold text-sm">PURPOSE</label>
        <app-select formControlName="purpose" [options]="purposes" placeholder="Select purpose" />
      </div>

      @if (form.value.purpose === 'Others') {
      <div class="flex flex-col gap-1">
        <label for="otherPurpose" class="font-line-seed font-bold text-sm">SPECIFY PURPOSE</label>
        <input id="otherPurpose" type="text" formControlName="otherPurpose"
          class="border-2 bg-border/50 font-line-seed text-text-primary border-text-primary w-70 py-2 px-1 h-9 shadow-[inset_0px_6px_0px_0px_#252422] focus:outline-none">
      </div>
      }
    </div>

    <div class="flex-1 m-5 p-3 border-2 border-text-primary shadow-[6px_6px_0px_0px_#252422]">
      <small>Live Preview</small>
    </div>
  </form>
</div>
